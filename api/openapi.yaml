openapi: 3.1.0
info:
  title: Ledger API
  version: 1.0.0
  description: |
    Idempotent double-entry payment ledger.

    All mutating endpoints require an `Idempotency-Key` header. Replaying the
    same key with the same body returns the original response and sets
    `Idempotent-Replayed: true`. Reusing a key with a different body returns 409.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose
security:
  - bearerAuth: []
tags:
  - name: accounts
  - name: transfers
  - name: holds
paths:
  /v1/accounts:
    post:
      tags: [accounts]
      summary: Create an account
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created or replayed
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/accounts/{accountID}:
    get:
      tags: [accounts]
      summary: Get an account
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{accountID}/balance:
    get:
      tags: [accounts]
      summary: Get an account balance projection
      operationId: getBalance
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{accountID}/entries:
    get:
      tags: [accounts]
      summary: List journal entries for an account
      operationId: listEntries
      parameters:
        - $ref: '#/components/parameters/AccountID'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Entries page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntriesPage'
        '400':
          $ref: '#/components/responses/ValidationError'
  /v1/transfers:
    post:
      tags: [transfers]
      summary: Create a transfer
      operationId: createTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer posted or replayed
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/transfers/{transferID}:
    get:
      tags: [transfers]
      summary: Get a transfer
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/TransferID'
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/holds:
    post:
      tags: [holds]
      summary: Reserve funds on an account
      operationId: createHold
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: Hold created or replayed
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/holds/{holdID}:
    get:
      tags: [holds]
      summary: Get a hold
      operationId: getHold
      parameters:
        - $ref: '#/components/parameters/HoldID'
      responses:
        '200':
          description: Hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/holds/{holdID}/capture:
    post:
      tags: [holds]
      summary: Capture a hold into a destination account
      operationId: captureHold
      parameters:
        - $ref: '#/components/parameters/HoldID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureHoldRequest'
      responses:
        '200':
          description: Hold captured or replayed
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/holds/{holdID}/release:
    post:
      tags: [holds]
      summary: Release a hold
      operationId: releaseHold
      parameters:
        - $ref: '#/components/parameters/HoldID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Hold released or replayed
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AccountID:
      name: accountID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferID:
      name: transferID
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldID:
      name: holdID
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    IdempotentReplayed:
      description: Present and set to "true" when the response was replayed.
      schema: { type: string, enum: ['true'] }
  schemas:
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          example: USD
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
          default: liability
        allow_negative:
          type: boolean
          default: false
          description: 'Allow the account balance to go negative. Intended for system accounts; customer accounts are usually created through the CLI.'
    Account:
      type: object
      required: [id, owner_id, name, currency, type, status, allow_negative, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string }
        name: { type: string }
        currency: { type: string }
        type: { type: string }
        status: { type: string }
        allow_negative: { type: boolean }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      required: [account_id, currency, balance, held, available, version, updated_at]
      properties:
        account_id: { type: string, format: uuid }
        currency: { type: string }
        balance: { type: string, description: 'Decimal string in major units, scaled by the currency (e.g. "10.50" = 10.50 USD).' }
        held: { type: string }
        available: { type: string }
        version: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [source_account_id, destination_account_id, amount, currency]
      properties:
        source_account_id: { type: string, format: uuid }
        destination_account_id:
          type: string
          format: uuid
          description: 'May belong to another owner (open-loop payee model); the source account must belong to the authenticated owner.'
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
          description: 'Decimal string; the pattern is syntax-only, and the server enforces the currency scale (JPY=0, USD=2, KWD=3).'
          example: '10.50'
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        description: { type: string, maxLength: 500 }
    Transfer:
      type: object
      required: [id, status, source_account_id, destination_account_id, amount, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        source_account_id: { type: string, format: uuid }
        destination_account_id: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
    CreateHoldRequest:
      type: object
      additionalProperties: false
      required: [account_id, amount, currency]
      properties:
        account_id: { type: string, format: uuid }
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,3})?$'
          description: 'Decimal string; the pattern is syntax-only, and the server enforces the currency scale (JPY=0, USD=2, KWD=3).'
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        expires_at: { type: string, format: date-time }
    CaptureHoldRequest:
      type: object
      additionalProperties: false
      required: [destination_account_id]
      properties:
        destination_account_id:
          type: string
          format: uuid
          description: 'May belong to another owner (open-loop payee model).'
    Hold:
      type: object
      required: [id, account_id, amount, currency, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string }
        status: { type: string, enum: [active, captured, released, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        captured_transaction_id: { type: string, format: uuid }
    Entry:
      type: object
      properties:
        id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: string }
        currency: { type: string }
        created_at: { type: string, format: date-time }
    EntriesPage:
      type: object
      required: [entries, has_more]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        next_cursor: { type: string }
        has_more: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
  responses:
    ValidationError:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not owned by the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Idempotency conflict or invalid state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Business rule violation (funds, currency, account state)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
