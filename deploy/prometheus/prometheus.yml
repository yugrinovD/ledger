global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: docker-compose

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ledger-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]
        labels:
          service: ledger-api
  - job_name: ledger-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: ledger-worker
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
